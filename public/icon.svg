<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="roseAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f43f5e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Subtle grid lines for construction craftsmanship theme -->
  <path d="M64 256h384M256 64v384" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Modern House Gable & Renovation Roofline -->
  <g filter="url(#glow)">
    <path d="M256 108 L404 228 L374 252 L256 156 L138 252 L108 228 Z" fill="url(#roseAmber)"/>
    <!-- Chimney -->
    <path d="M344 150 L344 180 L320 160 L320 130 Z" fill="#e11d48"/>
    <!-- Inner Home Frame -->
    <path d="M148 244 L148 376 C148 384 154 390 162 390 L350 390 C358 390 364 384 364 376 L364 244 L256 156 Z" fill="#0f172a" stroke="url(#roseAmber)" stroke-width="8"/>
  </g>

  <!-- Craftsman Crossed Tools / Hammer & Architectural Compass -->
  <g transform="translate(256, 305) scale(0.9)">
    <!-- Craftsman Hammer -->
    <path d="M-55 -40 L-35 -60 L-10 -35 L-20 -25 L35 30 C38 33 38 38 35 41 L26 50 C23 53 18 53 15 50 L-40 -5 L-50 5 L-75 -20 Z" fill="#94a3b8" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Claw / Head Accent in Rose -->
    <path d="M-55 -40 L-35 -60 L-15 -40 L-25 -30 L-35 -20 Z" fill="url(#roseAmber)"/>
    <!-- Center Measurement Square / Diamond -->
    <polygon points="0,-18 18,0 0,18 -18,0" fill="url(#gold)"/>
  </g>

  <!-- 42 Years Craftsmanship Badge -->
  <g transform="translate(256, 420)">
    <rect x="-110" y="-22" width="220" height="44" rx="22" fill="#1e293b" stroke="url(#gold)" stroke-width="3"/>
    <text x="0" y="7" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#fde047" letter-spacing="1.5">
      42 YEARS • RENEW
    </text>
  </g>
</svg>
